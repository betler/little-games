<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Guess the size!!</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        #barraProgreso {
            transition: width 1s ease-in-out;
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar navbar-dark bg-dark box-shadow">
            <div class="container d-flex justify-content-between">
                <a href="#" class="navbar-brand d-flex align-items-center">
                    <strong>Lucía's guess the size game</strong>
                </a>
                <div class="text-white">
                    Score: <span id="scoreSpan">0</span> | Streak: <span id="streakSpan">0</span>
                    <a href="#" id="resetScoreButton" class="text-white-50 ms-2" style="font-size: 70%;">(reset)</a>
                </div>
            </div>
        </div>
    </header>

    <main role="main">

        <section class="text-center bg-light" style="padding-top: 2em; padding-bottom: 2em;">
            <div class="container">
                <h1>Press start button!</h1>
                <p class="lead text-muted">You have to guess the size of the bar in %.</p>

                <div class="mb-3">
                    <label for="difficultySelect" class="form-label">Difficulty</label>
                    <select id="difficultySelect" class="form-select w-auto mx-auto">
                        <option value="10">Easy (±10)</option>
                        <option value="5" selected>Medium (±5)</option>
                        <option value="2">Hard (±2)</option>
                    </select>
                </div>

                <p>
                    <a href="#" id="startButton" class="fw-bold btn btn-primary my-2 py-3 px-5">START!</a>
                </p>
            </div>
        </section>

        <div class="album py-4">
            <div class="container w-50">
                <div class="progress" style="height: 6em;">
                    <div id="barraProgreso" class="progress-bar bg-info" role="progressbar" style="width: 0%"
                        aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>

        <div class="mt-3 w-50 container" style="font-size: 200%;">
            <label for="adivinaInput">Enter the guessed size</label>
            <input type="text" inputmode="numeric" id="adivinaInput" class="form-control"
                style="font-size:150%;text-align: right;" value="0" />
        </div>

        <div class="mt-3 w-50 container" style="font-size: 200%;">
            <a href="#" id="adivinaButton" class="fw-bold btn btn-success my-2 py-3 px-5 w-100">AM I
                CORRECT?</a>
        </div>
    </main>

    <!-- Modal HTML -->
    <div id="sucessModal" class="modal fade">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header text-center border-0" style="color:white; background-color: green;">
                    <h4 class="w-100 py-3"><i class="far fa-circle-check" style="font-size:300%;"></i><br/>Great! You have guessed the number<br/><small>Real value: <span id="realValueSpan"></span></small></h4>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img src="vernon-raineil-cenzon-EciYoOAwARs-unsplash.jpg" class="img w-100"/>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal HTML -->
    <div id="errorModal" class="modal fade">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header text-center border-0" style="color:white; background-color: red;">
                    <h4 class="w-100 py-3"><i class="fas fa-circle-exclamation" style="font-size:300%;"></i><br/>ERROR! That's not correct</h4>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img src="plane.jpg" class="img w-100"/>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="guess.js"></script>
</body>

</html>
