<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161829;
    --card: #1F2340;
    --text: #F4F4F9;
    --muted: #9AA0C3;
    --c4-a: #E63946;
    --c4-b: #FFD23F;
    --gts: #4ECDC4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 4rem;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    margin: 0 0 0.4rem;
    text-align: center;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 3rem;
    text-align: center;
    max-width: 32ch;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 280px));
    gap: 1.75rem;
    width: 100%;
    max-width: 680px;
  }
  @media (max-width: 620px) {
    .tiles { grid-template-columns: 1fr; justify-items: center; }
  }
  a.tile {
    background: var(--card);
    border-radius: 20px;
    padding: 1.75rem 1.5rem 1.5rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    width: 100%;
    max-width: 280px;
    outline-offset: 3px;
    transition: transform 0.15s ease;
  }
  a.tile:hover, a.tile:focus-visible { transform: translateY(-4px); }
  .tile h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.3rem;
    margin: 0;
  }
  .tile p {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
    text-align: center;
  }

  /* Connect Four visual: a little board with dropped discs */
  .c4-board {
    background: #2C3061;
    border-radius: 10px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .c4-board span {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #161829;
  }
  .c4-board span.a { background: var(--c4-a); }
  .c4-board span.b { background: var(--c4-b); }

  /* Guess the Size visual: a real partial progress bar */
  .gts-bar {
    width: 100%;
    height: 34px;
    border-radius: 8px;
    background: #2C3061;
    overflow: hidden;
  }
  .gts-bar div {
    height: 100%;
    width: 63%;
    background: var(--gts);
    border-radius: 8px 0 0 8px;
  }
</style>
</head>
<body>

  <h1>Game Room</h1>
  <p class="sub">Pick a game and play.</p>

  <div class="tiles">

    <a class="tile" href="connect4/connect4.html">
      <div class="c4-board">
        <span></span><span class="a"></span><span></span><span class="b"></span>
        <span></span><span class="b"></span><span class="a"></span><span></span>
        <span class="a"></span><span class="b"></span><span class="a"></span><span class="b"></span>
      </div>
      <h2>Connect Four</h2>
      <p>Line up four in a row before your opponent does.</p>
    </a>

    <a class="tile" href="guess-the-size/guess-the-size.html">
      <div class="gts-bar"><div></div></div>
      <h2>Guess the Size</h2>
      <p>Look at the bar and guess how full it is.</p>
    </a>

  </div>

</body>
</html>
