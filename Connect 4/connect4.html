<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect 4</title>
<style>
  :root {
    --bg: #0d1b2a;
    --board: #1b3a5c;
    --board-edge: #12283f;
    --hole: #0a1622;
    --red: #e63946;
    --red-glow: #ff6b78;
    --yellow: #ffca3a;
    --yellow-glow: #ffe08a;
    --text: #e8eef4;
    --muted: #7a94ad;
    --accent: #57cc99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at top, #16324f 0%, var(--bg) 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', system-ui, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .game {
    display: flex;
    align-items: center;
    gap: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: flex-start;
    min-width: 200px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 2px;
    font-weight: 800;
    text-transform: uppercase;
  }
  h1 .four { color: var(--yellow); }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
    width: 100%;
  }
  .controls .label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    border: 1px solid var(--muted);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #status {
    font-size: 18px;
    font-weight: 700;
    min-height: 26px;
    text-align: left;
  }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin: 0 4px; }
  .dot.red { background: var(--red); }
  .dot.yellow { background: var(--yellow); }
  .board-wrap {
    background: var(--board);
    border: 4px solid var(--board-edge);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 2px 10px rgba(255,255,255,.05);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .cell {
    width: clamp(44px, 10vw, 84px);
    height: clamp(44px, 10vw, 84px);
    background: var(--hole);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.6);
    transition: background .1s;
  }
  .column-hover .cell.preview {
    background: rgba(255,255,255,.08);
  }
  .disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform: translateY(-600%);
    animation: drop .45s cubic-bezier(.5,.05,.7,1.3) forwards;
  }
  .disc.red { background: radial-gradient(circle at 35% 30%, var(--red-glow), var(--red)); }
  .disc.yellow { background: radial-gradient(circle at 35% 30%, var(--yellow-glow), var(--yellow)); }
  .disc.win { box-shadow: 0 0 16px 3px var(--accent), inset 0 0 8px rgba(255,255,255,.6); }
  @keyframes drop { to { transform: translateY(0); } }
  #status.win { color: var(--accent); font-size: 22px; }
</style>
</head>
<body>
  <div class="game">
    <div class="sidebar">
      <h1>Connect <span class="four">4</span></h1>
      <div class="controls">
        <button id="mode-2p" class="active" onclick="setMode('2p')">2 Players</button>
        <button id="mode-cpu" onclick="setMode('cpu')">Vs Machine</button>
        <button onclick="resetGame()">New Game</button>
      </div>
      <div class="controls" id="difficulty" style="display:none;">
        <span class="label">Difficulty</span>
        <button id="diff-easy" onclick="setDifficulty(3)">Easy</button>
        <button id="diff-med" class="active" onclick="setDifficulty(5)">Medium</button>
        <button id="diff-hard" onclick="setDifficulty(7)">Hard</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>

<script>
const ROWS = 6, COLS = 7;
let grid, current, gameOver, mode, busy;
let searchDepth = 5;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function setMode(m) {
  mode = m;
  document.getElementById('mode-2p').classList.toggle('active', m === '2p');
  document.getElementById('mode-cpu').classList.toggle('active', m === 'cpu');
  document.getElementById('difficulty').style.display = m === 'cpu' ? 'flex' : 'none';
  resetGame();
}

function setDifficulty(depth) {
  searchDepth = depth;
  document.getElementById('diff-easy').classList.toggle('active', depth === 3);
  document.getElementById('diff-med').classList.toggle('active', depth === 5);
  document.getElementById('diff-hard').classList.toggle('active', depth === 7);
  resetGame();
}

function resetGame() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  current = 1; // 1 = red, 2 = yellow
  gameOver = false;
  busy = false;
  render();
  updateStatus();
}

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.col = c;
      cell.dataset.row = r;
      cell.onmouseenter = () => hoverCol(c, true);
      cell.onmouseleave = () => hoverCol(c, false);
      cell.onclick = () => play(c);
      if (grid[r][c]) {
        const disc = document.createElement('div');
        disc.className = 'disc ' + (grid[r][c] === 1 ? 'red' : 'yellow');
        disc.style.animation = 'none';
        cell.appendChild(disc);
      }
      boardEl.appendChild(cell);
    }
  }
}

function hoverCol(c, on) {
  if (gameOver || busy) return;
  document.querySelectorAll(`.cell[data-col="${c}"]`).forEach(el => {
    el.classList.toggle('preview', on);
    el.parentElement.classList.toggle('column-hover', on);
  });
}

function lowestRow(c) {
  for (let r = ROWS - 1; r >= 0; r--) if (!grid[r][c]) return r;
  return -1;
}

function play(c) {
  if (gameOver || busy) return;
  const r = lowestRow(c);
  if (r < 0) return;
  drop(r, c, current);
  const win = checkWin(r, c, current);
  if (win) { endGame(win); return; }
  if (isFull()) { endGame(null); return; }
  current = current === 1 ? 2 : 1;
  updateStatus();
  if (mode === 'cpu' && current === 2 && !gameOver) {
    busy = true;
    setTimeout(cpuMove, 120);
  }
}

function drop(r, c, player) {
  grid[r][c] = player;
  const cell = document.querySelector(`.cell[data-col="${c}"][data-row="${r}"]`);
  const disc = document.createElement('div');
  disc.className = 'disc ' + (player === 1 ? 'red' : 'yellow');
  cell.appendChild(disc);
}

function isFull() { return grid[0].every(v => v); }

function directions(r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const line = [[r,c]];
    for (const s of [1,-1]) {
      let nr = r + dr*s, nc = c + dc*s;
      while (nr>=0 && nr<ROWS && nc>=0 && nc<COLS && grid[nr][nc]===player) {
        line.push([nr,nc]); nr += dr*s; nc += dc*s;
      }
    }
    if (line.length >= 4) return line;
  }
  return null;
}

function checkWin(r, c, player) { return directions(r, c, player); }

function endGame(winLine) {
  gameOver = true;
  if (winLine) {
    winLine.forEach(([r,c]) => {
      const cell = document.querySelector(`.cell[data-col="${c}"][data-row="${r}"] .disc`);
      if (cell) cell.classList.add('win');
    });
    const winner = grid[winLine[0][0]][winLine[0][1]];
    const name = mode === 'cpu' && winner === 2 ? 'Machine' : (winner === 1 ? 'Red' : 'Yellow');
    statusEl.className = 'win';
    statusEl.innerHTML = `${name} wins! <span class="dot ${winner===1?'red':'yellow'}"></span>`;
  } else {
    statusEl.className = '';
    statusEl.textContent = "Draw. Nobody's happy.";
  }
}

function updateStatus() {
  statusEl.className = '';
  if (mode === 'cpu' && current === 2) {
    statusEl.innerHTML = `Machine thinking... <span class="dot yellow"></span>`;
  } else {
    const name = mode === 'cpu' ? (current === 1 ? 'Your turn' : 'Machine') : (current === 1 ? 'Red' : 'Yellow');
    statusEl.innerHTML = `${name} <span class="dot ${current===1?'red':'yellow'}"></span>`;
  }
}

// --- CPU: minimax with alpha-beta pruning ---
// AI is player 2 (maximizing), human is player 1 (minimizing).

const CENTER_ORDER = [3, 2, 4, 1, 5, 0, 6]; // search center-first for better pruning

function validCols() {
  const v = [];
  for (const c of CENTER_ORDER) if (lowestRow(c) >= 0) v.push(c);
  return v;
}

// Wins detectable from a hypothetical piece already placed at (r,c).
function makesLine(r, c, player) { return !!directions(r, c, player); }

// Score a 4-cell window for the AI (player 2).
function scoreWindow(win) {
  let ai = 0, human = 0, empty = 0;
  for (const v of win) { if (v === 2) ai++; else if (v === 1) human++; else empty++; }
  if (ai && human) return 0;
  if (ai === 3 && empty === 1) return 50;
  if (ai === 2 && empty === 2) return 10;
  if (human === 3 && empty === 1) return -80; // weight defense a bit higher
  if (human === 2 && empty === 2) return -8;
  return 0;
}

function evaluate() {
  let score = 0;
  // Center column control
  for (let r = 0; r < ROWS; r++) if (grid[r][3] === 2) score += 6;
  // All 4-length windows
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      for (const [dr, dc] of dirs) {
        const er = r + 3*dr, ec = c + 3*dc;
        if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
        const win = [grid[r][c], grid[r+dr][c+dc], grid[r+2*dr][c+2*dc], grid[er][ec]];
        score += scoreWindow(win);
      }
    }
  }
  return score;
}

function minimax(depth, alpha, beta, maximizing, lastR, lastC, lastPlayer) {
  // Terminal: previous move won the game.
  if (lastR >= 0 && makesLine(lastR, lastC, lastPlayer)) {
    return lastPlayer === 2 ? 100000 + depth : -100000 - depth;
  }
  const cols = validCols();
  if (depth === 0 || cols.length === 0) return evaluate();

  if (maximizing) {
    let best = -Infinity;
    for (const c of cols) {
      const r = lowestRow(c);
      grid[r][c] = 2;
      best = Math.max(best, minimax(depth - 1, alpha, beta, false, r, c, 2));
      grid[r][c] = 0;
      alpha = Math.max(alpha, best);
      if (alpha >= beta) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const c of cols) {
      const r = lowestRow(c);
      grid[r][c] = 1;
      best = Math.min(best, minimax(depth - 1, alpha, beta, true, r, c, 1));
      grid[r][c] = 0;
      beta = Math.min(beta, best);
      if (alpha >= beta) break;
    }
    return best;
  }
}

function cpuMove() {
  const cols = validCols();
  let bestScore = -Infinity;
  const bestCols = [];
  for (const c of cols) {
    const r = lowestRow(c);
    grid[r][c] = 2;
    const score = makesLine(r, c, 2)
      ? 1000000
      : minimax(searchDepth - 1, -Infinity, Infinity, false, r, c, 2);
    grid[r][c] = 0;
    if (score > bestScore) { bestScore = score; bestCols.length = 0; bestCols.push(c); }
    else if (score === bestScore) { bestCols.push(c); }
  }
  // Tie-break randomly among equal-value moves so it isn't robotic.
  const chosen = bestCols[Math.floor(Math.random() * bestCols.length)];
  busy = false;
  play(chosen);
}

setMode('2p');
</script>
</body>
</html>
